<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=z, initial-scale=1.0">
    <title>Document</title>
    <style>
      div {
        width: 500px;
        background-color: #fff;
        width: 500px;
        height: 200px;
        background-color: #fff;
      }
    </style>
</head>
<body>
    <div></div>
    <!-- p.box 类选择器 -->
    <p class="box"></p>
    <!-- .box -->
    <div class="box"></div>
    <!-- p#box id选择器 -->
    <p id="box"></p>
    <!-- 同级标签 div+p  -->
     <div></div>
     <p></p>
     <!-- 父子级标签 div>p  -->
      <div>
        <p></p>
      </div>
      <!-- 多个相同标签 span*3 -->
       <span></span><span></span><span></span>
       <!-- 有内容的标签 div{1111} -->
        <div>111</div>

</body>
</html>
