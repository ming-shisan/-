<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=z, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 技巧：选择器选中标签的范围越大，优先级/权重越低 */
        * {
            /* !important 提权功能，提高权重/优先级到最高，慎用 */
            color: red !important;
        }
        div {
            color: blue;
        }
        .box {
            color: aqua;
        }
        #test {
            color: blueviolet;
        }

    </style>
</head>
<body>
    <div class="box" id="test" style="color: black;">div标签</div>
</body>
</html>
