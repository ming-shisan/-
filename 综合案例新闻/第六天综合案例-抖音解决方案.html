<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抖音解决方案</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        li {
            list-style: none;
        }
        .box {
            margin: 50px auto;
            width: 1200px;
            height: 418px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }
        .box ul {
            display: flex;
            /* 调整主轴对齐方式 */
            justify-content: space-between;
            /* 弹性盒子换行 */
            flex-wrap: wrap;
            /* 调整行对齐方式 */
            align-content: space-between;
            padding: 90px 40px 90px 60px;
            height: 418px;
        }
        .box li {
            display: flex;
            width: 500px;
            height: 88px;
            background-color: skyblue;
        }
        .box .pic {
            margin-right: 15px;
        }
        .box .text h4 {
            height: 40px;
            font-size: 20px;
            font-weight: 400;
            color: #333;
        }
        .box .text p {
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
